name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify tag and application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

  build:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      - name: Build and upload native installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign macOS bundles without importing an Apple certificate.
          # Certificate and notarization variables must remain undefined because
          # Tauri treats even defined-but-empty values as signing configuration.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: v__VERSION__
          releaseName: DeepHUD v__VERSION__
          releaseBody: See CHANGELOG.md for release notes and SHA256SUMS for download verification.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseAssetNamePattern: DeepHUD_[version]_[platform]_[arch][setup][ext]

  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download release installers
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Create SHA256SUMS
        working-directory: release-assets
        run: find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > ../SHA256SUMS
      - name: Upload SHA256SUMS
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
